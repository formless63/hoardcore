name: gluetun

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  gluetun:
    image: ${GLUETUN_IMAGE:-qmcgaw/gluetun:v3.41.3}
    container_name: gluetun
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - ${STACK_DIR:?Set the absolute host stack directory}/data/gluetun:/gluetun
    ports:
      - "127.0.0.1:${VPN_PROXY_PORT:-8888}:8888/tcp"
      - "127.0.0.1:${VPN_CONTROL_PORT:-8000}:8000/tcp"
    environment:
      TZ: ${TZ:-Etc/UTC}
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${PROTON_KEY:?Set the Proton WireGuard private key}
      SERVER_COUNTRIES: ${SERVER_COUNTRIES:-United States}
      PORT_FORWARD_ONLY: "off"
      VPN_PORT_FORWARDING: "off"
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      HTTPPROXY_USER: ${VPN_PROXY_USER:?Set the proxy username}
      HTTPPROXY_PASSWORD: ${VPN_PROXY_PASS:?Set the proxy password}
      HTTPPROXY_LOG: "off"
      FIREWALL_INPUT_PORTS: "8000,8888"
      FIREWALL_OUTBOUND_SUBNETS: ${FIREWALL_OUTBOUND_SUBNETS:-}
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
      HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: >-
        {"auth":"apikey","apikey":"${GLUETUN_API_KEY:?Set the control API key}"}
    networks: [glue_net]
    logging: *logging

  socket-proxy:
    image: ${SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:latest}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      PING: "1"
      VERSION: "1"
      # Needed for Companion's Gluetun recreation and optional benchmark sidecars.
      # This enables writes, including DELETE, on the allowed endpoint groups.
      POST: "1"
    networks: [docker-api]
    logging: *logging

  companion:
    # Upstream is beta; use a tested digest override when promoting a release.
    image: ${COMPANION_IMAGE:-ghcr.io/aerya/gluetun-companion:latest}
    container_name: gluetun-companion
    restart: unless-stopped
    volumes:
      - ${STACK_DIR:?Set the absolute host stack directory}/data/companion:/data
      # Same host/container path is important for nested Docker Compose commands.
      - ${STACK_DIR:?Set the absolute host stack directory}:${STACK_DIR:?Set the absolute host stack directory}:rw
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      TZ: ${TZ:-Etc/UTC}
      SECRET_KEY: ${COMPANION_SECRET_KEY:?Set a stable Companion encryption/session key}
      DATA_DIR: /data
      GLUETUN_HOST: gluetun
      GLUETUN_PROXY_PORT: "8888"
      GLUETUN_CONTAINER: gluetun
      SIDECAR_HOST: host.docker.internal
      COMPOSE_DIR: ${STACK_DIR:?Set the absolute host stack directory}
      COMPOSE_PROJECT: gluetun
      CONTROL_BACKEND: compose
      DOCKER_HOST: tcp://socket-proxy:2375
    expose: ["8765"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      # Keep the UI available even when the VPN is unhealthy, for diagnostics.
      gluetun:
        condition: service_started
      socket-proxy:
        condition: service_started
    networks: [glue_net, docker-api, gateway]
    logging: *logging

networks:
  glue_net:
    name: glue_net
    driver: bridge
  docker-api:
    internal: true
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:?Set the existing gateway connector network}
