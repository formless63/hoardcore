services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hoardcore
      POSTGRES_USER: hoardcore
      POSTGRES_PASSWORD: hoardcore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoardcore -d hoardcore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
